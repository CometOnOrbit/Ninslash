name: Build

on:
  push:
  pull_request:

jobs:
  release-readiness-tests:
    name: Release readiness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install test dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake python3 zlib1g-dev

      - name: Configure focused tests
        run: cmake -B build-tests -DCLIENT=OFF -DNINSLASH_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build focused tests and dedicated server
        run: cmake --build build-tests -j"$(nproc)"

      - name: Run focused tests
        run: ctest --test-dir build-tests --output-on-failure

      - name: Run fixed-seed PvE smoke baseline
        run: |
          python3 scripts/smoke_pve_matrix.py \
            --server build-tests/ninslash_srv \
            --depth 1 --depth 5 --timeout 12 --port 8397 --log-dir smoke-logs

      - name: Validate release tooling
        run: |
          python3 scripts/audit_release_assets.py
          python3 scripts/check_localization.py
          python3 scripts/check_text_layout.py

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: ninslash-linux_x86_64-release.tar.xz
            builder: bam
          - name: Windows x64
            os: windows-latest
            artifact: ninslash-windows_x64-release.zip
            builder: cmake
          - name: macOS arm64
            os: macos-latest
            artifact: ninslash-macos_arm64-release.tar.xz
            builder: cmake

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Report release asset licensing
        run: python3 scripts/audit_release_assets.py

      - name: Checkout Bam
        if: matrix.builder == 'bam'
        uses: actions/checkout@v4
        with:
          repository: matricks/bam
          ref: 8cd08744c37666830d439ab54016c9d228c63b68
          path: ./bam

      - name: Checkout SDL3
        if: contains(matrix.os, 'ubuntu')
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 68bfcb6c5419f51104e74e72ea0f8d405a4615b0
          path: ./SDL

      - name: Prepare Linux
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git cmake clang python3 bam \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libibus-1.0-dev libdbus-1-dev \
            libudev-dev libinput-dev libts-dev libjpeg-dev libwebp-dev \
            libglew-dev libfreetype6-dev
          cd SDL
          cmake . -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build . -j"$(nproc)"
          sudo cmake --install .

      - name: Prepare Windows
        if: contains(matrix.os, 'windows')
        run: |
          cmake -S . -B build -A x64

      - name: Prepare macOS
        if: contains(matrix.os, 'macos')
        run: brew install cmake freetype sdl3 glew python3

      - name: Build Release (Linux)
        if: matrix.builder == 'bam' && contains(matrix.os, 'ubuntu')
        run: bam release

      - name: Build Release (Windows)
        if: contains(matrix.os, 'windows')
        run: cmake --build build --config Release --parallel

      - name: Build Release (macOS)
        if: contains(matrix.os, 'macos')
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Package Release (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          tar -cJf "${{ matrix.artifact }}" \
            cfg data ninslash ninslash_srv \
            autoexec.cfg autoexec_client.cfg license.txt THIRD_PARTY_LICENSES.md README.md README_zh-CN.md storage.cfg

      - name: Package Release (Windows)
        if: contains(matrix.os, 'windows')
        shell: pwsh
        run: |
          $dir = "ninslash-windows_x64-release"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -Recurse cfg, data $dir
          Copy-Item build/Release/ninslash.exe, build/Release/ninslash_srv.exe $dir
          Copy-Item autoexec.cfg, autoexec_client.cfg, license.txt, THIRD_PARTY_LICENSES.md, README.md, README_zh-CN.md, storage.cfg $dir
          Copy-Item build/Release/freetype.dll, build/Release/SDL3.dll $dir
          Copy-Item other/freetype/LICENSE.TXT "$dir/freetype-license.txt"
          Compress-Archive -Path $dir -DestinationPath "${{ matrix.artifact }}" -Force

      - name: Package Release (macOS)
        if: contains(matrix.os, 'macos')
        run: |
          pkg="ninslash-macos_arm64-release"
          mkdir -p "$pkg"
          cp -R cfg data autoexec.cfg autoexec_client.cfg license.txt THIRD_PARTY_LICENSES.md README.md README_zh-CN.md storage.cfg "$pkg/"
          cp build/ninslash build/ninslash_srv "$pkg/"
          if [ -f build/ninslash_srv-Launcher ]; then
            cp build/ninslash_srv-Launcher "$pkg/"
          fi
          tar -cJf "${{ matrix.artifact }}" "$pkg"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Enforce release asset licensing
        run: python3 scripts/audit_release_assets.py --strict

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ninslash-*-release.*
          merge-multiple: true

      - name: Show release files
        run: ls -lah dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ninslash ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  steam-macos-depots:
    name: Build Steam macOS depots
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: release-readiness-tests
    runs-on: macos-latest
    timeout-minutes: 60
    environment: steam-beta
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout Steamworks SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STEAMWORKS_SDK_REPOSITORY }}
          token: ${{ secrets.STEAMWORKS_SDK_TOKEN }}
          path: steamworks-sdk
          persist-credentials: false

      - name: Locate Steamworks SDK
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/steamworks-sdk/public/steam/steam_api.h" ]]; then
            sdk_root="$GITHUB_WORKSPACE/steamworks-sdk"
          elif [[ -f "$GITHUB_WORKSPACE/steamworks-sdk/sdk/public/steam/steam_api.h" ]]; then
            sdk_root="$GITHUB_WORKSPACE/steamworks-sdk/sdk"
          else
            echo "Steamworks SDK checkout must contain public/steam/steam_api.h" >&2
            exit 1
          fi
          echo "STEAMWORKS_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        run: brew install cmake freetype sdl3 glew python3

      - name: Build Steam-enabled macOS release
        run: |
          cmake -S . -B build-steam-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_STEAMWORKS=ON \
            -DENABLE_STEAM_GAMESERVER=ON \
            -DENABLE_STEAM_LISTEN_SERVER=ON \
            -DENABLE_LUA_MODS=ON \
            -DSTEAMWORKS_SDK_ROOT="$STEAMWORKS_SDK_ROOT" \
            -DSTEAM_APP_ID=1812700 \
            -DSTEAM_PLAYTEST_APP_ID=1812730 \
            -DSTEAM_GAMESERVER_APP_ID=5016790 \
            -DSTEAM_MACOS_CLIENT_DEPOT_ID=1812704 \
            -DSTEAM_MACOS_SERVER_DEPOT_ID=5016794
          cmake --build build-steam-macos -j"$(sysctl -n hw.ncpu)"

      - name: Stage and verify macOS depots
        run: |
          python3 scripts/stage_steam_build.py \
            --platform macos --kind client \
            --build-dir build-steam-macos \
            --output dist/steam-macos/macos-client \
            --steam-api "$STEAMWORKS_SDK_ROOT/redistributable_bin/osx/libsteam_api.dylib"
          python3 scripts/stage_steam_build.py \
            --platform macos --kind server \
            --build-dir build-steam-macos \
            --output dist/steam-macos/macos-server \
            --steam-api "$STEAMWORKS_SDK_ROOT/redistributable_bin/osx/libsteam_api.dylib"
          python3 scripts/verify_steam_release.py \
            --macos-client dist/steam-macos/macos-client \
            --macos-server dist/steam-macos/macos-server

      - name: Upload macOS Steam depots
        uses: actions/upload-artifact@v4
        with:
          name: ninslash-steam-macos-depots
          path: dist/steam-macos
          if-no-files-found: error
          retention-days: 7

  steam-windows-depots:
    name: Build Steam Windows depots
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: release-readiness-tests
    runs-on: windows-latest
    timeout-minutes: 60
    environment: steam-beta
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout Steamworks SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STEAMWORKS_SDK_REPOSITORY }}
          token: ${{ secrets.STEAMWORKS_SDK_TOKEN }}
          path: steamworks-sdk
          persist-credentials: false

      - name: Locate Steamworks SDK
        shell: pwsh
        run: |
          $checkoutRoot = Join-Path $env:GITHUB_WORKSPACE "steamworks-sdk"
          $rootManifest = Join-Path $checkoutRoot "public/steam/steam_api.h"
          $nestedRoot = Join-Path $checkoutRoot "sdk"
          $nestedManifest = Join-Path $nestedRoot "public/steam/steam_api.h"
          if (Test-Path $rootManifest) {
            $sdkRoot = $checkoutRoot
          } elseif (Test-Path $nestedManifest) {
            $sdkRoot = $nestedRoot
          } else {
            throw "Steamworks SDK checkout must contain public/steam/steam_api.h"
          }
          "STEAMWORKS_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Steam-enabled Windows release
        shell: pwsh
        run: |
          cmake -S . -B build-steam-windows -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_STEAMWORKS=ON `
            -DENABLE_STEAM_GAMESERVER=ON `
            -DENABLE_STEAM_LISTEN_SERVER=ON `
            -DENABLE_LUA_MODS=ON `
            "-DSTEAMWORKS_SDK_ROOT=$env:STEAMWORKS_SDK_ROOT" `
            -DSTEAM_APP_ID=1812700 `
            -DSTEAM_PLAYTEST_APP_ID=1812730 `
            -DSTEAM_GAMESERVER_APP_ID=5016790 `
            -DSTEAM_WINDOWS_CLIENT_DEPOT_ID=1812702 `
            -DSTEAM_LINUX_CLIENT_DEPOT_ID=1812703 `
            -DSTEAM_MACOS_CLIENT_DEPOT_ID=1812704 `
            -DSTEAM_WINDOWS_SERVER_DEPOT_ID=5016792 `
            -DSTEAM_LINUX_SERVER_DEPOT_ID=5016793 `
            -DSTEAM_MACOS_SERVER_DEPOT_ID=5016794
          cmake --build build-steam-windows --config Release --parallel

      - name: Verify native Windows Steam binaries
        shell: pwsh
        run: |
          python -m pip install pefile
          $release = (Resolve-Path "build-steam-windows/Release").Path
          python scripts/verify_steam_release.py `
            --steam-windows-client "$release/ninslash.exe" `
            --steam-windows-server "$release/ninslash_srv.exe"

      - name: Prepare Windows Steam build artifact
        shell: pwsh
        run: |
          $artifact = "steam-windows-build"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          Copy-Item "build-steam-windows/CMakeCache.txt" "$artifact/CMakeCache.txt"
          Get-ChildItem -Path "build-steam-windows/Release" -File | Copy-Item -Destination $artifact -Force
          if (-not (Test-Path "$artifact/ninslash.exe") -or
              -not (Test-Path "$artifact/ninslash_srv.exe") -or
              -not (Test-Path "$artifact/steam_api64.dll")) {
            throw "Native Steam Windows build artifact is incomplete"
          }

      - name: Upload Windows Steam build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninslash-steam-windows-build
          path: steam-windows-build
          if-no-files-found: error
          retention-days: 7

  steam-internal:
    name: Publish Steam internal
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - release-readiness-tests
      - build
      - steam-macos-depots
      - steam-windows-depots
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: steam-beta
    concurrency:
      group: steam-internal
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout Steamworks SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STEAMWORKS_SDK_REPOSITORY }}
          token: ${{ secrets.STEAMWORKS_SDK_TOKEN }}
          path: steamworks-sdk
          persist-credentials: false

      - name: Locate Steamworks SDK
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/steamworks-sdk/public/steam/steam_api.h" ]]; then
            sdk_root="$GITHUB_WORKSPACE/steamworks-sdk"
          elif [[ -f "$GITHUB_WORKSPACE/steamworks-sdk/sdk/public/steam/steam_api.h" ]]; then
            sdk_root="$GITHUB_WORKSPACE/steamworks-sdk/sdk"
          else
            echo "Steamworks SDK checkout must contain public/steam/steam_api.h" >&2
            exit 1
          fi
          echo "STEAMWORKS_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 68bfcb6c5419f51104e74e72ea0f8d405a4615b0
          path: SDL

      - name: Install Steam build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake curl python3 binutils-mingw-w64-x86-64 lib32gcc-s1 \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libibus-1.0-dev libdbus-1-dev \
            libudev-dev libinput-dev libts-dev libjpeg-dev libwebp-dev \
            libglew-dev libfreetype6-dev
          cmake -S SDL -B SDL/build -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build SDL/build -j"$(nproc)"
          sudo cmake --install SDL/build
          sudo ldconfig

      - name: Build Steam-enabled Linux release
        shell: bash
        run: |
          cmake -S . -B build-steam-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_STEAMWORKS=ON \
            -DENABLE_STEAM_GAMESERVER=ON \
            -DENABLE_STEAM_LISTEN_SERVER=ON \
            -DENABLE_LUA_MODS=ON \
            -DSTEAMWORKS_SDK_ROOT="$STEAMWORKS_SDK_ROOT" \
            -DSTEAM_APP_ID=1812700 \
            -DSTEAM_PLAYTEST_APP_ID=1812730 \
            -DSTEAM_GAMESERVER_APP_ID=5016790 \
            -DSTEAM_WINDOWS_CLIENT_DEPOT_ID=1812702 \
            -DSTEAM_LINUX_CLIENT_DEPOT_ID=1812703 \
            -DSTEAM_MACOS_CLIENT_DEPOT_ID=1812704 \
            -DSTEAM_WINDOWS_SERVER_DEPOT_ID=5016792 \
            -DSTEAM_LINUX_SERVER_DEPOT_ID=5016793 \
            -DSTEAM_MACOS_SERVER_DEPOT_ID=5016794
          cmake --build build-steam-linux --parallel "$(nproc)"

      - name: Install SteamCMD and restore cached login
        shell: bash
        env:
          STEAMCMD_AUTH_B64: ${{ secrets.STEAMCMD_AUTH_B64 }}
        run: |
          test -n "$STEAMCMD_AUTH_B64" || { echo "Missing STEAMCMD_AUTH_B64 secret" >&2; exit 1; }
          steamcmd_root="$RUNNER_TEMP/steamcmd"
          steamcmd_home="$HOME/Steam"
          mkdir -p "$steamcmd_root"
          mkdir -p "$steamcmd_home"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$steamcmd_root"
          "$steamcmd_root/steamcmd.sh" +quit
          printf '%s' "$STEAMCMD_AUTH_B64" | base64 --decode | tar -xz -C "$steamcmd_home"
          test -f "$steamcmd_home/config/config.vdf" || {
            echo "STEAMCMD_AUTH_B64 must contain config/config.vdf and any ssfn files" >&2
            exit 1
          }
          chmod -R go-rwx "$steamcmd_home/config"
          echo "SteamCMD cached login restored under $steamcmd_home/config"
          echo "STEAMCMD=$steamcmd_root/steamcmd.sh" >> "$GITHUB_ENV"

      - name: Download macOS Steam depots
        uses: actions/download-artifact@v4
        with:
          name: ninslash-steam-macos-depots
          path: dist/steam-macos

      - name: Download Windows Steam build
        uses: actions/download-artifact@v4
        with:
          name: ninslash-steam-windows-build
          path: build-steam-windows

      - name: Verify and publish Steam internal
        env:
          STEAM_ACCOUNT: ${{ secrets.STEAM_ACCOUNT }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          # Optional repository variable. Leave unset to upload builds only; promote
          # BuildIDs to internal in Steamworks manually. Set to "internal" once the
          # build account has publish permission on all three AppIDs.
          STEAM_SET_LIVE_BRANCH: ${{ vars.STEAM_SET_LIVE_BRANCH }}
        run: |
          test -n "$STEAM_ACCOUNT" || { echo "Missing STEAM_ACCOUNT secret" >&2; exit 1; }
          publish_args=(
            --linux-build-dir build-steam-linux
            --windows-build-dir build-steam-windows
            --macos-client-depot dist/steam-macos/macos-client
            --macos-server-depot dist/steam-macos/macos-server
            --sdk-root "$STEAMWORKS_SDK_ROOT"
            --output-root dist/steam-internal
            --no-build
            --strict-assets
            --upload
            --steam-account "$STEAM_ACCOUNT"
            --steamcmd "$STEAMCMD"
          )
          if [[ -n "${STEAM_SET_LIVE_BRANCH:-}" ]]; then
            echo "Will set live branch: $STEAM_SET_LIVE_BRANCH"
            publish_args+=(--set-live "$STEAM_SET_LIVE_BRANCH")
          else
            echo "STEAM_SET_LIVE_BRANCH is unset; uploading builds without changing live branches"
          fi
          python3 scripts/publish_steam_depots.py "${publish_args[@]}"
