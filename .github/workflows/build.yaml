name: Build

on:
  push:
  pull_request:

jobs:
  release-readiness-tests:
    name: Release readiness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install test dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake python3 zlib1g-dev

      - name: Configure focused tests
        run: cmake -B build-tests -DCLIENT=OFF -DNINSLASH_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build focused tests and dedicated server
        run: cmake --build build-tests -j"$(nproc)"

      - name: Run focused tests
        run: ctest --test-dir build-tests --output-on-failure

      - name: Run fixed-seed PvE smoke baseline
        run: |
          python3 scripts/smoke_pve_matrix.py \
            --server build-tests/ninslash_srv \
            --depth 1 --depth 5 --timeout 12 --port 8397 --log-dir smoke-logs

      - name: Validate release tooling
        run: |
          python3 scripts/audit_release_assets.py
          python3 scripts/check_localization.py
          python3 scripts/check_text_layout.py

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: ninslash-linux_x86_64-release.tar.xz
            builder: bam
          - name: Windows x64
            os: windows-latest
            artifact: ninslash-windows_x64-release.zip
            builder: bam
          - name: macOS arm64
            os: macos-latest
            artifact: ninslash-macos_arm64-release.tar.xz
            builder: cmake

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Report release asset licensing
        run: python3 scripts/audit_release_assets.py

      - name: Checkout Bam
        if: matrix.builder == 'bam'
        uses: actions/checkout@v4
        with:
          repository: matricks/bam
          ref: 8cd08744c37666830d439ab54016c9d228c63b68
          path: ./bam

      - name: Checkout SDL3
        if: contains(matrix.os, 'ubuntu')
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 68bfcb6c5419f51104e74e72ea0f8d405a4615b0
          path: ./SDL

      - name: Prepare Linux
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git cmake clang python3 bam \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libibus-1.0-dev libdbus-1-dev \
            libudev-dev libinput-dev libts-dev libjpeg-dev libwebp-dev \
            libglew-dev libfreetype6-dev
          cd SDL
          cmake . -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build . -j"$(nproc)"
          sudo cmake --install .

      - name: Prepare Windows
        if: contains(matrix.os, 'windows')
        run: |
          cd bam
          ./make_win64_msvc.bat

      - name: Prepare macOS
        if: matrix.builder == 'cmake'
        run: brew install cmake freetype sdl3 glew python3

      - name: Build Release (Linux)
        if: matrix.builder == 'bam' && contains(matrix.os, 'ubuntu')
        run: bam release

      - name: Build Release (Windows)
        if: matrix.builder == 'bam' && contains(matrix.os, 'windows')
        run: ./bam/bam release

      - name: Build Release (macOS)
        if: matrix.builder == 'cmake'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Package Release (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          tar -cJf "${{ matrix.artifact }}" \
            cfg data ninslash ninslash_srv \
            autoexec.cfg license.txt THIRD_PARTY_LICENSES.md README.md README_zh-CN.md storage.cfg

      - name: Package Release (Windows)
        if: contains(matrix.os, 'windows')
        shell: pwsh
        run: |
          $dir = "ninslash-windows_x64-release"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -Recurse cfg, data $dir
          Copy-Item ninslash.exe, ninslash_srv.exe, autoexec.cfg, license.txt, THIRD_PARTY_LICENSES.md, README.md, README_zh-CN.md, storage.cfg $dir
          Copy-Item freetype.dll, SDL3.dll, glew32.dll $dir
          Copy-Item other/freetype/LICENSE.TXT "$dir/freetype-license.txt"
          Compress-Archive -Path $dir -DestinationPath "${{ matrix.artifact }}" -Force

      - name: Verify and smoke-test Windows package
        if: contains(matrix.os, 'windows')
        shell: pwsh
        run: |
          python -m pip install pefile
          $dir = (Resolve-Path "ninslash-windows_x64-release").Path
          python scripts/verify_steam_release.py `
            --standalone-windows-client "$dir/ninslash.exe" `
            --standalone-windows-server "$dir/ninslash_srv.exe"

          $env:NINSLASH_OFFSCREEN = "1"
          $process = Start-Process -FilePath "$dir/ninslash.exe" `
            -ArgumentList '"pve_debug_screenshot 1"' -WorkingDirectory $dir -PassThru
          $log = Join-Path $env:APPDATA "Ninslash/logs/startup.log"
          $screenshots = Join-Path $env:APPDATA "Ninslash/screenshots"
          $ready = $false
          for($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Milliseconds 500
            if($process.HasExited) { break }
            if((Test-Path $log) -and
               (Select-String -Path $log -SimpleMatch "main menu initialization completed" -Quiet) -and
               (Test-Path $screenshots) -and
               (Get-ChildItem $screenshots -Filter "screenshot_*.png" -ErrorAction SilentlyContinue)) {
              $ready = $true
              break
            }
          }
          if(-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          if(-not $ready) {
            if(Test-Path $log) { Get-Content $log }
            throw "Windows client did not reach the menu and produce an offscreen screenshot"
          }

          $env:NINSLASH_TEST_FORCE_WINDOW_FAILURE = "1"
          $env:NINSLASH_TEST_NO_MESSAGEBOX = "1"
          $failureProcess = Start-Process -FilePath "$dir/ninslash.exe" `
            -WorkingDirectory $dir -PassThru
          if(-not $failureProcess.WaitForExit(30000)) {
            Stop-Process -Id $failureProcess.Id -Force
            throw "Forced window failure did not exit cleanly"
          }
          if(-not (Select-String -Path $log -SimpleMatch "forced window creation failure" -Quiet) -or
             -not (Select-String -Path $log -SimpleMatch "all graphics initialization attempts failed" -Quiet)) {
            if(Test-Path $log) { Get-Content $log }
            throw "Forced window failure was not handled by the graphics fallback path"
          }

      - name: Package Release (macOS)
        if: matrix.builder == 'cmake'
        run: |
          pkg="ninslash-macos_arm64-release"
          mkdir -p "$pkg"
          cp -R cfg data autoexec.cfg license.txt THIRD_PARTY_LICENSES.md README.md README_zh-CN.md storage.cfg "$pkg/"
          cp build/ninslash build/ninslash_srv "$pkg/"
          if [ -f build/ninslash_srv-Launcher ]; then
            cp build/ninslash_srv-Launcher "$pkg/"
          fi
          tar -cJf "${{ matrix.artifact }}" "$pkg"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Enforce release asset licensing
        run: python3 scripts/audit_release_assets.py --strict

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ninslash-*-release.*
          merge-multiple: true

      - name: Show release files
        run: ls -lah dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ninslash ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
